<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Williams – William Roobrouck</title>
<meta name="description" content="Beelden, kunstobjecten en design in cortenstaal, staal, licht en vuur van William Roobrouck (Laarne).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&family=Inter:wght@400;500&family=Outfit:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000; --mute:#8a8a8a; --line:#e6e6e6; --soft:#f7f7f7; --bg:#fff;
    --body:"Inter",system-ui,sans-serif;
    --display:"Barlow Condensed","Arial Narrow",sans-serif;
    --mark:"Outfit","Inter",sans-serif;
    --gut:30px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/21px var(--body);letter-spacing:.12px;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
  img{display:block;width:100%;height:auto}
  .muted{color:var(--mute)}

  /* ---------- Header ---------- */
  header.hd{position:fixed;inset:0 0 auto 0;height:80px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 var(--gut);background:var(--bg)}
  .hd-left{display:flex;align-items:center;gap:22px}
  .burger{width:20px;height:14px;position:relative}
  .burger i{position:absolute;left:0;right:0;height:1.4px;background:var(--ink);transition:transform .25s,opacity .2s}
  .burger i:nth-child(1){top:0}.burger i:nth-child(2){top:6px}.burger i:nth-child(3){top:12px}
  .menu-open .burger i:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .menu-open .burger i:nth-child(2){opacity:0}
  .menu-open .burger i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  nav.main{display:none;gap:22px;align-items:center}
  .menu-open nav.main{display:flex}
  nav.main a,nav.main button{font-size:14px}
  nav.main .on{font-weight:500}
  nav.main a:hover,nav.main button:hover{color:var(--mute)}
  .hd-right{display:flex;align-items:center;gap:14px;font-size:14px}
  .mark-sm{font:500 26px/1 var(--mark);letter-spacing:-.04em;opacity:0;transition:opacity .3s}
  .show-mark .mark-sm,.not-home .mark-sm{opacity:1}
  .lang{position:relative}
  .lang > button::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink);margin:0 8px 2px 0;vertical-align:middle}
  .lang ul{display:none;position:absolute;right:0;top:28px;list-style:none;margin:0;padding:10px 0;background:var(--bg);min-width:120px;text-align:right}
  .lang.open ul{display:block}
  .lang li a{display:block;padding:3px 0}
  .lang li a:hover{color:var(--mute)}

  /* Submenu overlay (like the Artists overlay) */
  .sub{position:fixed;inset:80px 0 0 0;background:var(--bg);z-index:40;display:none;padding:12px var(--gut) 0 calc(var(--gut) + 42px)}
  .sub.open{display:block}
  .sub a{display:block;padding:9px 0;font-size:15px}
  .sub a:hover{color:var(--mute)}

  main{padding-top:80px;min-height:70vh}
  .view{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ---------- Home ---------- */
  .home-mark{padding:70px 0 110px 19.5%}
  .home-mark h1{margin:0;font:500 clamp(64px,8.6vw,132px)/.9 var(--mark);letter-spacing:-.055em}
  .strip{height:min(828px,100vh);position:relative;display:flex;flex-direction:column;justify-content:center}
  .strip + .strip{border-top:0}
  .rail{overflow:hidden;height:688px;max-height:calc(100vh - 120px);padding-top:13px}
  .track{display:flex;width:max-content;height:100%;animation:slide var(--dur,90s) linear infinite}
  .rail:hover .track{animation-play-state:paused}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .slide{width:378px;padding:0 15px;height:100%;display:flex}
  .slide.top{align-items:flex-start}.slide.mid{align-items:center}.slide.bot{align-items:flex-end}
  .tile{position:relative;display:block;width:100%;overflow:hidden;background:var(--soft)}
  .tile img{height:100%;object-fit:cover}
  .slide > div > .tile{height:100%}
  .tile .ov{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;transition:opacity .3s}
  .tile .lb{position:absolute;right:12px;bottom:10px;color:#fff;font-size:14px;opacity:0;transition:opacity .3s;text-align:right}
  .tile:hover .ov,.tile:hover .lb{opacity:1}
  .chev{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .chev svg{width:14px;height:14px}

  /* ---------- Shared page head ---------- */
  .pg{padding:0 var(--gut)}
  .back{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin:22px 0 8px}
  .back:hover{color:var(--mute)}
  .back svg{width:7px;height:10px}
  .ttl{font:400 40px/40px var(--display);text-transform:uppercase;margin:6px 0 30px;letter-spacing:0}
  .ttl.xl{font-size:clamp(56px,6.2vw,96px);line-height:.95;margin:4px 0 40px}
  .ttl-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
  .viewsw{display:flex;gap:12px;font-size:14px;padding-bottom:34px}
  .viewsw button{color:var(--mute)}
  .viewsw button.on{color:var(--ink);font-weight:500}

  /* List view (like the Photographers list) */
  .listwrap{position:relative;min-height:62vh}
  .names{columns:2;column-gap:30px;width:min(760px,52%);margin:0 0 80px;padding:0;list-style:none}
  .names li{break-inside:avoid}
  .names a{display:inline-block;padding:3px 0 23px;font-size:15px}
  .names a:hover,.names a.hl{font-weight:500}
  .names .tag{font-size:11px;color:var(--mute);margin-left:6px}
  .preview{position:absolute;right:0;top:20px;width:45%;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start;pointer-events:none}
  .preview img{opacity:0;transition:opacity .25s}
  .preview.on img{opacity:1}
  .preview img:nth-child(2){margin-top:40px}

  /* Scattered grid (artist page / image view) */
  .scatter{display:grid;grid-template-columns:repeat(4,1fr);column-gap:30px;row-gap:40px;margin-bottom:80px}
  .scatter .tile{aspect-ratio:var(--ar,4/5)}
  .scatter .first{grid-column:2 / span 2}

  /* Work info block (like the profile/contact block) */
  .info{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;padding:50px 0 60px;border-top:1px solid var(--line)}
  .info h3{font-size:15px;font-weight:500;margin:0 0 10px}
  .info p{margin:0 0 12px}
  .info .span2{grid-column:span 2}
  .specs{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 18px}
  .specs dt{color:var(--mute)}.specs dd{margin:0}
  .inq{display:flex;border-bottom:1px solid var(--ink);margin-top:14px;max-width:340px}
  .inq input{flex:1;border:0;padding:8px 0;font:inherit;outline:0;background:none}
  .inq button{font-weight:500}
  .pager{display:flex;justify-content:space-between;padding:20px 0 50px;font-size:14px}
  .pager a:hover{color:var(--mute)}

  /* Text pages */
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;margin-bottom:70px}
  .cols h2{font:400 26px/1.1 var(--display);text-transform:uppercase;margin:0 0 14px}
  .cols h3{font-size:15px;font-weight:500;margin:0 0 6px}
  .cols p{margin:0 0 14px}
  .s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:1 / -1}
  .c2{grid-column:2 / span 2}.c3{grid-column:3 / span 2}
  .lead{font-size:22px;line-height:1.35;letter-spacing:-.01em;margin:0 0 20px}
  .rule{border-top:1px solid var(--line);padding-top:24px}
  .steps{list-style:none;margin:0;padding:0;counter-reset:s}
  .steps li{counter-increment:s;padding:14px 0;border-top:1px solid var(--line)}
  .steps li::before{content:"0" counter(s);color:var(--mute);margin-right:18px;font-size:13px}
  .arrow{font-weight:500;display:inline-block;margin-top:6px}
  .arrow:hover{color:var(--mute)}

  /* Agenda */
  .year{display:grid;grid-template-columns:1fr 3fr;gap:30px;border-top:1px solid var(--line);padding:22px 0 34px}
  .year h2{font:400 40px/1 var(--display);margin:0}
  .ev{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px;padding:8px 0}
  .ev .d{color:var(--mute)}

  /* Contact */
  form.cf{display:grid;gap:18px;max-width:560px}
  .cf label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
  .cf input,.cf select,.cf textarea{font:inherit;color:var(--ink);border:0;border-bottom:1px solid var(--ink);padding:8px 0;background:none;outline:0;border-radius:0}
  .cf textarea{min-height:110px;resize:vertical}
  .cf .chk{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
  .cf .chk input{width:auto;margin-top:4px}
  .cf button{justify-self:start;font-weight:500;border-bottom:1px solid var(--ink);padding-bottom:2px}
  .ok{display:none;font-weight:500}
  .sent .ok{display:block}.sent .cf{display:none}

  .totop{display:block;text-align:center;font-size:14px;padding:30px 0}
  .totop:hover{color:var(--mute)}

  /* ---------- Footer ---------- */
  footer.ft{background:var(--soft);padding:32px var(--gut);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .ft-left{display:flex;align-items:center;gap:34px;flex-wrap:wrap}
  .ft .mk{font:500 30px/1 var(--mark);letter-spacing:-.05em}
  .nl{display:flex;align-items:center;background:var(--bg);width:330px;max-width:100%}
  .nl input{flex:1;border:0;padding:12px 14px;font:inherit;outline:0;min-width:0}
  .nl button{padding:12px 14px;color:var(--mute)}
  .nl button:hover{color:var(--ink)}
  .ft-links{display:flex;gap:28px;font-size:14px;flex-wrap:wrap}
  .ft-links a:hover{color:var(--mute)}

  /* ---------- Mobile ---------- */
  @media (max-width:820px){
    :root{--gut:16px}
    header.hd{height:64px}
    main{padding-top:64px}
    .sub{inset:64px 0 0 0;padding-left:var(--gut)}
    .menu-open nav.main{display:flex;position:fixed;inset:64px 0 0 0;background:var(--bg);flex-direction:column;align-items:flex-start;padding:16px var(--gut);gap:14px}
    .menu-open nav.main a,.menu-open nav.main button{font-size:24px;line-height:1.2}
    .home-mark{padding:40px var(--gut) 50px}
    .strip{height:auto;padding:20px 0 60px}
    .rail{height:440px}
    .slide{width:260px;padding:0 10px}
    .ttl-row{flex-direction:column;align-items:flex-start}
    .viewsw{padding-bottom:20px}
    .names{columns:1;width:100%}
    .names a{padding-bottom:12px}
    .preview{display:none}
    .scatter{grid-template-columns:1fr 1fr;column-gap:12px;row-gap:12px}
    .scatter > *{grid-column:auto !important}
    .scatter .first{grid-column:1 / -1 !important}
    .info,.cols{grid-template-columns:1fr}
    .info > *,.cols > *{grid-column:auto !important}
    .year{grid-template-columns:1fr;gap:10px}
    .ev{grid-template-columns:1fr;gap:0;padding:10px 0}
    footer.ft{flex-direction:column;align-items:flex-start}
  }
  @media (prefers-reduced-motion:reduce){.track{animation:none}.view{animation:none}}
</style>
</head>

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const src = p => U + p;
const chevL = '<svg viewBox="0 0 7 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 1 2 5l4 4"/></svg>';
const gal = w => w.g ? w.g : [w.img];
const arOf = p => { const m = p.match(/-(\d{3,4})x(\d{3,4})/); return m ? `${m[1]}/${m[2]}` : '4/5'; };
function tile(href, img, label, cls='', ar){
  return `<a class="tile ${cls}" href="${href}" ${ar?`style="--ar:${ar}"`:''}>
    <img src="${src(img)}" alt="${esc(label)}" loading="lazy">
    <span class="ov"></span><span class="lb">${esc(label)}</span></a>`;
}
function back(href, text){ return `<a class="back" href="${href}">${chevL}<span>${text}</span></a>`; }

/* ---------- Views ---------- */
function vHome(){
  const aligns=['top','mid','bot','mid','top','bot'];
  const heights=['78%','63%','70%','88%','60%','74%'];
  let html = `<section class="home-mark"><h1>williams</h1></section>`;
  STRIPS.forEach((row,ri)=>{
    const slides = row.map((k,i)=>{
      const w = BY[k], e = EXTRA[k];
      const href = w ? `#/werk/${w.s}` : e.href, img = w ? w.img : e.img, t = w ? w.t : e.t;
      const a = aligns[(i+ri)%aligns.length], h = heights[(i*2+ri)%heights.length];
      return `<div class="slide ${a}"><div style="width:100%;height:${h}">${tile(href,img,t,'','')}</div></div>`;
    }).join('');
    html += `<section class="strip" id="s${ri}"><div class="rail"><div class="track" style="--dur:${80+ri*14}s">${slides}${slides}</div></div>
      ${ri<STRIPS.length-1?`<a class="chev" href="#s${ri+1}" data-scroll="s${ri+1}" aria-label="Volgende"><svg viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.3"><path d="m1 1 6 6 6-6"/></svg></a>`:''}</section>`;
  });
  return html;
}

function vWorkList(mode){
  const list = WORKS.map(w=>`<li><a href="#/werk/${w.s}" data-pv="${w.s}">${esc(w.t)}${w.n?'<span class="tag">nieuw</span>':''}</a></li>`).join('');
  const grid = WORKS.map((w,i)=>tile(`#/werk/${w.s}`, w.img, w.t, '', '4/5')).join('');
  return `<div class="pg">${back('#/','Terug')}
    <div class="ttl-row"><h1 class="ttl">Werk</h1>
      <div class="viewsw"><button data-mode="list" class="${mode!=='beeld'?'on':''}">Lijst</button><button data-mode="beeld" class="${mode==='beeld'?'on':''}">Beeld</button></div></div>
    ${mode==='beeld'
      ? `<div class="scatter" style="grid-template-columns:repeat(4,1fr)">${grid}</div>`
      : `<div class="listwrap"><ul class="names">${list}</ul><div class="preview" id="pv"><img alt=""><img alt=""></div></div>`}
  </div>`;
}

const COLS = [2,3,4,1,4,1,3,2,3,1,4,2];
function scatter(items, firstWide=true){
  return `<div class="scatter">${items.map((it,i)=>{
    const col = i===0 && firstWide ? null : COLS[i % COLS.length];
    return `<div ${col?`style="grid-column:${col}"`:''} class="${i===0&&firstWide?'first':''}">${it}</div>`;
  }).join('')}</div>`;
}

function vWork(slug){
  const w = BY[slug]; if(!w) return vWorkList();

  const imgs = gal(w).map((p,k)=>tile('#', p, `${w.t} — ${String(k+1).padStart(2,'0')}`, 'zoom', arOf(p)));
  const spec = w.spec ? `<dl class="specs">${Object.entries(w.spec).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : `<p class="muted">Afmetingen, materiaal en prijs op aanvraag.</p>`;
  return `<div class="pg">${back('#/werk','Terug naar werk')}
    <h1 class="ttl xl">${esc(w.t)}</h1>
    ${scatter(imgs)}
    <section class="info">

    <nav class="pager"><a href="#/werk/${prev.s}">← ${esc(prev.t)}</a><a href="#top" data-top>Terug naar boven</a><a href="#/werk/${next.s}">${esc(next.t)} →</a></nav>

}

/* ---------- Router ---------- */
const app = $('#app');
let listMode = 'list';
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  if (h.startsWith('s') && document.getElementById(h)) return;
  const [a,b] = h.split('/');
  let html, nav='';
  switch(a){
    case '': case undefined: html=vHome(); break;
    case 'werk': html = b ? vWork(b) : vWorkList(listMode); nav='werk'; break;
    case 'categorie': html=vCat(b); nav='werk'; break;
    case 'agenda': html=vAgenda(); nav='agenda'; break;
    case 'over': html=vOver(); nav='over'; break;
    case 'opdrachten': html=vOpdrachten(); nav='opdrachten'; break;
    case 'contact': html=vContact(); nav='contact'; break;
    default: html=vHome();
  }
  document.body.classList.toggle('not-home', !!a);
  app.innerHTML = `<div class="view">${html}</div>`;
  document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('on', n.dataset.nav===nav));
  closeMenus(); window.scrollTo(0,0); bind();
  document.title = (a ? (app.querySelector('h1')?.textContent+' – ') : '') + 'Williams';
}
function bind(){
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{listMode=b.dataset.mode; app.innerHTML=`<div class="view">${vWorkList(listMode)}</div>`; bind();});
  const pv = $('#pv');
  if(pv){ const [i1,i2]=pv.querySelectorAll('img');
    app.querySelectorAll('[data-pv]').forEach(a=>{
      a.onmouseenter=()=>{const w=BY[a.dataset.pv],g=gal(w);i1.src=src(w.img);i2.src=src(g[1]||g[0]);pv.classList.add('on');a.classList.add('hl');};
      a.onmouseleave=()=>{pv.classList.remove('on');a.classList.remove('hl');};
    });
  }
  app.querySelectorAll('[data-scroll]').forEach(c=>c.onclick=e=>{e.preventDefault();document.getElementById(c.dataset.scroll).scrollIntoView({behavior:'smooth'});});
  app.querySelectorAll('[data-top]').forEach(c=>c.onclick=e=>{e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});
  app.querySelectorAll('.tile.zoom').forEach(t=>t.onclick=e=>{e.preventDefault();openLb(t.querySelector('img').src);});
}

/* Lightbox for work images */
const lb = document.createElement('div');
lb.style.cssText='position:fixed;inset:0;background:#fff;z-index:80;display:none;align-items:center;justify-content:center;padding:70px 30px;cursor:zoom-out';
lb.innerHTML='<img style="max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain" alt=""><span style="position:absolute;top:26px;right:30px;font-size:14px">Sluiten</span>';
document.body.appendChild(lb);
function openLb(s){lb.querySelector('img').src=s;lb.style.display='flex';}
lb.onclick=()=>lb.style.display='none';
document.addEventListener('keydown',e=>{if(e.key==='Escape'){lb.style.display='none';closeMenus();}});

/* Menu */
const hd=$('#hd'), sub=$('#sub'), lang=$('#lang');
function closeMenus(){document.body.classList.remove('menu-open');sub.classList.remove('open');lang.classList.remove('open');}
$('#burger').onclick=()=>{const open=!document.body.classList.contains('menu-open');closeMenus();if(open)document.body.classList.add('menu-open');};
$('#nav-werk').onclick=()=>sub.classList.toggle('open');
sub.addEventListener('click',e=>{if(e.target.tagName==='A')closeMenus();});
$('#lang-btn').onclick=e=>{e.stopPropagation();lang.classList.toggle('open');};
document.querySelectorAll('[data-lang]').forEach(a=>a.onclick=e=>{e.preventDefault();$('#lang-btn').textContent=a.textContent;lang.classList.remove('open');});
document.addEventListener('click',e=>{if(!lang.contains(e.target))lang.classList.remove('open');});

/* Small wordmark appears after scrolling past the big one on home */
window.addEventListener('scroll',()=>document.body.classList.toggle('show-mark',scrollY>220),{passive:true});

window.addEventListener('hashchange',route);
route();
